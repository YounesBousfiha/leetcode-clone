server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: composite
  cloud:
    config:
      server:
        composite:
          # Vault Configuration
          - type: vault
            host: ${VAULT_HOST:localhost}
            port: ${VAULT_PORT:8200}
            scheme: http
            kv-version: 2
            authentication: TOKEN
            token: ${VAULT_TOKEN}

          # Git Configuration
          - type: git
            uri: https://github.com/younesbousfiha/codemaster-config-repo.git
            username: ${GIT_USERNAME}
            password: ${GIT_TOKEN}
            clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

# ?? ??? ????? ???: management ????? ???? ????? ?????? (??????)
