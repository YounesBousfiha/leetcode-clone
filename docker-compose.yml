services:
  # PostgreSQL Database - Auth Service
  postgres-auth:
    image: postgres:15-alpine
    container_name: leetcode-postgres-auth
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - leetcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcode -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database - User Service
  postgres-user:
    image: postgres:15-alpine
    container_name: leetcode-postgres-user
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode123
      POSTGRES_DB: user_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    networks:
      - leetcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcode -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database - Problem Service
  postgres-problem:
    image: postgres:15-alpine
    container_name: leetcode-postgres-problem
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode123
      POSTGRES_DB: problem_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_problem_data:/var/lib/postgresql/data
    networks:
      - leetcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcode -d problem_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database - Judge Service
  postgres-judge:
    image: postgres:15-alpine
    container_name: leetcode-postgres-judge
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode123
      POSTGRES_DB: judge_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_judge_data:/var/lib/postgresql/data
    networks:
      - leetcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcode -d judge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: leetcode-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - leetcode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: leetcode-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: leetcode
      RABBITMQ_DEFAULT_PASS: leetcode123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - leetcode-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # HashiCorp Vault - Secrets Management
  vault:
    image: hashicorp/vault:1.16
    container_name: leetcode-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-myroot}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
    networks:
      - leetcode-network
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault bootstrap - writes app secrets after Vault is healthy
  vault-init:
    image: hashicorp/vault:1.16
    container_name: leetcode-vault-init
    networks:
      - leetcode-network
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-myroot}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    command:
      - /bin/sh
      - /vault-init.sh
    volumes:
      - ./scripts/vault-init.sh:/vault-init.sh:ro

  # Eureka Server
  eureka-server:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args:
        SERVICE_NAME: eureka-server
        SERVICE_PATH: infrastructure
    container_name: leetcode-eureka
    ports:
      - "8761:8761"
    networks:
      - leetcode-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Config Server
  config-server:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args:
        SERVICE_NAME: config-server
        SERVICE_PATH: infrastructure
    container_name: leetcode-config-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_HOST: vault
      VAULT_TOKEN: ${VAULT_TOKEN:-myroot}
      GIT_USERNAME: ${GIT_USERNAME}
      GIT_TOKEN: ${GIT_TOKEN}
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - leetcode-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PATH: infrastructure
    container_name: leetcode-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - leetcode-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args:
        SERVICE_NAME: auth-service
        SERVICE_PATH: services
    container_name: leetcode-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: leetcode
      SPRING_DATASOURCE_PASSWORD: leetcode123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: leetcode
      SPRING_RABBITMQ_PASSWORD: leetcode123
      SPRING_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - leetcode-network

  # User Service
  user-service:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args:
        SERVICE_NAME: user-service
        SERVICE_PATH: services
    container_name: leetcode-user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: leetcode
      SPRING_DATASOURCE_PASSWORD: leetcode123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: leetcode
      SPRING_RABBITMQ_PASSWORD: leetcode123
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8082:8082"
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - leetcode-network

  # Problem Service
  problem-service:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args:
        SERVICE_NAME: problem-service
        SERVICE_PATH: services
    container_name: leetcode-problem-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-problem:5432/problem_db
      SPRING_DATASOURCE_USERNAME: leetcode
      SPRING_DATASOURCE_PASSWORD: leetcode123
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8086:8086"
    depends_on:
      postgres-problem:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - leetcode-network

  # Judge temp volume bootstrap
  judge-temp-init:
    image: alpine:3.20
    container_name: leetcode-judge-temp-init
    restart: "no"
    command:
      - /bin/sh
      - -c
      - mkdir -p /judge-temp && chmod 0777 /judge-temp
    volumes:
      - judge_temp_data:/judge-temp

  # Judge Service
  judge-service:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args:
        SERVICE_NAME: judge-service
        SERVICE_PATH: services
        INSTALL_DOCKER_CLI: "true"
    container_name: leetcode-judge-service
    user: "0:0"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-judge:5432/judge_db
      SPRING_DATASOURCE_USERNAME: leetcode
      SPRING_DATASOURCE_PASSWORD: leetcode123
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      JUDGE_TEMP_DIR: /judge-temp
      JUDGE_DOCKER_SHARED_VOLUME: leetcode_judge_temp_data
      JUDGE_DOCKER_EXECUTABLE: /usr/bin/docker
    ports:
      - "8083:8083"
    depends_on:
      postgres-judge:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      judge-temp-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - judge_temp_data:/judge-temp
    networks:
      - leetcode-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args:
        SERVICE_NAME: notification-service
        SERVICE_PATH: services
    container_name: leetcode-notification-service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: leetcode
      SPRING_RABBITMQ_PASSWORD: leetcode123
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - leetcode-network

  # AI Assist Service
  ai-assist-service:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      args:
        SERVICE_NAME: ai-assist-service
        SERVICE_PATH: services
    container_name: leetcode-ai-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      doc_HOST: redis
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - leetcode-network

volumes:
  postgres_auth_data:
  postgres_user_data:
  postgres_problem_data:
  postgres_judge_data:
  judge_temp_data:
    name: leetcode_judge_temp_data
  redis_data:
  rabbitmq_data:
  vault_data:
  vault_logs:

networks:
  leetcode-network:
    driver: bridge

