# Test Configuration for AI Assist Service
spring.application.name=ai-assist-service

# DeepSeek Test Configuration (Mock/Stub values)
spring.ai.deepseek.api-key=test-api-key-12345
spring.ai.deepseek.base-url=https://api.deepseek.com
spring.ai.deepseek.chat.options.model=deepseek-chat
spring.ai.deepseek.chat.options.temperature=0.7
spring.ai.deepseek.chat.options.max-tokens=1500

# Redis (Embedded for tests)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Disable Eureka for tests
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# Disable Config Server for tests
spring.cloud.config.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.leetcode.aiassistant=DEBUG
logging.level.org.springframework.ai=DEBUG

