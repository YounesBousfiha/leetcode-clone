# ============================================================
# deploy.yml - Deploy to Kubernetes via ArgoCD
# ============================================================
name: Deploy

on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]
    branches: [ main ]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Update ArgoCD manifests with new image tags
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_PREFIX="${GITHUB_REPOSITORY_OWNER,,}/leetcode"
          SERVICES=(auth-service user-service problem-service judge-service ai-assist-service notification-service api-gateway eureka-server)
          for SERVICE in "${SERVICES[@]}"; do
            if [ -f "argocd/${SERVICE}.yaml" ]; then
              sed -i "s|image:.*${SERVICE}.*|image: ${REGISTRY}/${IMAGE_PREFIX}-${SERVICE}:${IMAGE_TAG}|g" argocd/${SERVICE}.yaml
              echo "Updated argocd/${SERVICE}.yaml with tag ${IMAGE_TAG}"
            fi
          done

      - name: Commit manifest updates
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add argocd/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger ArgoCD Sync (optional)
        if: env.ARGOCD_SERVER != ''
        run: |
          echo "ArgoCD will auto-sync from git changes."
          echo "Manual sync can be triggered via ArgoCD UI at ${ARGOCD_SERVER}"

