# ============================================================
# build.yml - Build all services and Docker images
# ============================================================
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests --batch-mode

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: '**/target/*.jar'
          retention-days: 5

  docker:
    name: Build Docker Images
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - { name: auth-service, path: services/auth-service }
          - { name: user-service, path: services/user-service }
          - { name: problem-service, path: services/problem-service }
          - { name: judge-service, path: services/judge-service }
          - { name: ai-assist-service, path: services/ai-assist-service }
          - { name: notification-service, path: services/notification-service }
          - { name: api-gateway, path: infrastructure/api-gateway }
          - { name: eureka-server, path: infrastructure/eureka-server }
          - { name: config-server, path: infrastructure/config-server }

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build service
        run: mvn clean package -DskipTests --batch-mode -pl ${{ matrix.service.path }} -am

      - name: Normalize image prefix
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY_OWNER,,}/leetcode" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile
          build-args: |
            SERVICE_NAME=${{ matrix.service.name }}
            SERVICE_PATH=${{ matrix.service.path }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}

