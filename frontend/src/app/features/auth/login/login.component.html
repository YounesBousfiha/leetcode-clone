<div class="w-full">

  <div class="text-center mb-8">
    <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
    <p class="text-slate-500 mt-2">Enter your credentials to access your account</p>
  </div>

  <div class="flex flex-col gap-3 mb-6">
    <button class="w-full flex items-center justify-center gap-2 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-medium py-2.5 px-4 rounded-lg transition-all">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
      <span>Continue with Google</span>
    </button>
    <button class="w-full flex items-center justify-center gap-2 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-medium py-2.5 px-4 rounded-lg transition-all">
      <img src="https://www.svgrepo.com/show/448234/github.svg" class="w-5 h-5" alt="GitHub">
      <span>Continue with GitHub</span>
    </button>
  </div>

  <div class="relative flex py-2 items-center mb-6">
    <div class="flex-grow border-t border-slate-200"></div>
    <span class="flex-shrink mx-4 text-slate-400 text-sm">Or</span>
    <div class="flex-grow border-t border-slate-200"></div>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">

    <div class="flex flex-col gap-2">
      <label for="email" class="text-sm font-medium text-slate-700">Email Address</label>
      <input
        pInputText
        id="email"
        formControlName="email"
        placeholder="name@example.com"
        class="w-full !py-2.5"
        [ngClass]="{'ng-invalid ng-dirty': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}"
      />
      @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
        <small class="text-red-500 text-xs">Please enter a valid email address.</small>
      }
    </div>

    <div class="flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <label for="password" class="text-sm font-medium text-slate-700">Password</label>
        <a routerLink="/forget-password" class="text-sm text-orange-600 hover:text-orange-700 font-medium no-underline">Forgot password?</a>
      </div>
      <p-password
        id="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        class="w-full"
        inputStyleClass="w-full !py-2.5"
        placeholder="••••••••"
      ></p-password>
    </div>

    <p-button
      label="Sign In"
      type="submit"
      [loading]="loading"
      styleClass="w-full py-2.5 bg-slate-900 border-slate-900 hover:bg-slate-800"
    ></p-button>

  </form>

  <div class="mt-6 text-center text-sm text-slate-600">
    Don't have an account?
    <a routerLink="/register" class="font-bold text-orange-600 hover:text-orange-700 no-underline transition-colors">Sign up</a>
  </div>

</div>
